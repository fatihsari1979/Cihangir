<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cihangir Kapı</title>
<style>
    * { box-sizing: border-box; margin: 0; }
    body {
        font-family: -apple-system, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #e8eaed;
        margin: 0;
        padding: 20px 0;
    }

    #pinScreen {
        background: white;
        padding: 40px 30px;
        border-radius: 32px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        text-align: center;
        width: 90%;
        max-width: 360px;
    }
    #pinScreen h2 { margin-bottom: 20px; color: #1a1a1a; }
    #pinScreen input {
        width: 100%;
        padding: 16px;
        font-size: 20px;
        text-align: center;
        letter-spacing: 8px;
        border: 2px solid #ddd;
        border-radius: 14px;
        outline: none;
        transition: 0.2s;
    }
    #pinScreen input:focus { border-color: #1a73e8; }
    #pinScreen button {
        margin-top: 20px;
        width: 100%;
        padding: 16px;
        font-size: 18px;
        font-weight: 600;
        background: #1a73e8;
        color: white;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        transition: 0.2s;
    }
    #pinScreen button:active { transform: scale(0.96); }
    #pinError {
        color: #d93025;
        margin-top: 12px;
        font-size: 14px;
        min-height: 20px;
    }

    #mainApp {
        display: none;
        background: white;
        padding: 30px 20px 35px;
        border-radius: 32px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.12);
        text-align: center;
        width: 90%;
        max-width: 400px;
    }
    #mainApp h1 { font-size: 26px; color: #1a1a1a; margin-bottom: 6px; }
    .sub { color: #888; font-size: 14px; margin-bottom: 25px; }

    .button-group {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
    }
    .btn-door {
        flex: 1;
        min-width: 130px;
        padding: 22px 0;
        font-size: 20px;
        font-weight: 600;
        border: none;
        border-radius: 20px;
        color: white;
        cursor: pointer;
        transition: transform 0.15s, opacity 0.2s;
        touch-action: manipulation;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .btn-door:active { transform: scale(0.93); }
    .btn-door:disabled {
        opacity: 0.5;
        transform: scale(0.98);
        pointer-events: none;
    }
    .btn-women { background: #e91e63; }
    .btn-men   { background: #1e88e5; }

    #status {
        margin-top: 25px;
        padding: 14px;
        border-radius: 16px;
        font-size: 15px;
        font-weight: 500;
        background: #f1f3f4;
        color: #3c4043;
        transition: all 0.3s;
        min-height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    .status-loading { background: #fff3cd; color: #856404; }
    .status-success { background: #d4edda; color: #155724; }
    .status-error   { background: #f8d7da; color: #721c24; }
    .status-closing { background: #cce5ff; color: #004085; }
</style>
</head>
<body>

<!-- ================= PIN EKRANI ================= -->
<div id="pinScreen">
    <h2>🔐 Yetki Kodu</h2>
    <input type="password" id="pinInput" maxlength="6"
           placeholder="PIN Girin" inputmode="numeric" autocomplete="off">
    <button id="pinBtn">Giriş Yap</button>
    <div id="pinError"></div>
</div>

<!-- ================= ANA UYGULAMA ================= -->
<div id="mainApp">
    <h1>🚪 Cihangir</h1>
    <div class="sub">Kapı Otomatı</div>

    <div class="button-group">
        <button class="btn-door btn-women" id="btnWomen">👩 Hanımlar</button>
        <button class="btn-door btn-men"   id="btnMen">👨 Erkekler</button>
    </div>

    <div id="status">Hazır</div>
</div>

<script>
/* ================== AYARLAR ================== */
const CFG = {
    API_KEY: "C9F3F30A218E7C9F160E12644B9E2AB8",
    BASE_URL: "https://us01.proxy.teleduino.org/api/1.0/328.php",

    SECRET_PIN: "1234",

    // Röle seviyeleri (kapı açılmıyorsa 0 ve 1'i ters çevir)
    OPEN_OUTPUT: 0,     // LOW  -> röle çeker, kapı açılır
    CLOSE_OUTPUT: 1,    // HIGH -> röle bırakır, kapı kapanır

    REQUEST_TIMEOUT_MS: 6000,
    COOLDOWN_MS: 1200,
    STATUS_RESET_MS: 2500
};

// Her kapı: pin numarası ve açık kalma süresi (saniye)
const DOORS = {
    women: { label: 'Hanımlar', pin: 2, hold: 3 },  // 2 sn -> 3 sn
    men:   { label: 'Erkekler', pin: 4, hold: 2 }   // pin 3 -> pin 4 (Arduino 4. pin)
};
/* ============================================ */

const pinScreen = document.getElementById('pinScreen');
const mainApp   = document.getElementById('mainApp');
const pinInput  = document.getElementById('pinInput');
const pinError  = document.getElementById('pinError');
const statusEl  = document.getElementById('status');
const btnWomen  = document.getElementById('btnWomen');
const btnMen    = document.getElementById('btnMen');
const allBtns   = [btnWomen, btnMen];

let busy = false;
let statusTimer = null;

/* ---------------- Yardımcılar ---------------- */

function setStatus(text, cls) {
    if (statusTimer) { clearTimeout(statusTimer); statusTimer = null; }
    statusEl.textContent = text;
    statusEl.className = cls || '';
}

function resetStatusLater(ms) {
    if (statusTimer) clearTimeout(statusTimer);
    statusTimer = setTimeout(() => setStatus('Hazır'), ms);
}

function setButtons(enabled) {
    allBtns.forEach(b => { b.disabled = !enabled; });
}

function vibrate(pattern) {
    if (navigator.vibrate) navigator.vibrate(pattern);
}

/* ---------------- PIN kontrolü ---------------- */

function checkPin() {
    if (pinInput.value === CFG.SECRET_PIN) {
        sessionStorage.setItem('cihangir_auth', '1');
        unlock();
    } else {
        pinError.textContent = '❌ Yanlış şifre, tekrar deneyin.';
        pinInput.value = '';
        pinInput.focus();
        vibrate(120);
    }
}

function unlock() {
    pinScreen.style.display = 'none';
    mainApp.style.display   = 'block';
    pinError.textContent    = '';
    pinInput.value          = '';
}

document.getElementById('pinBtn').addEventListener('click', checkPin);
pinInput.addEventListener('keydown', e => { if (e.key === 'Enter') checkPin(); });

// Sayfa yenilenirse tekrar PIN sormasın (sekme kapanınca silinir)
if (sessionStorage.getItem('cihangir_auth') === '1') unlock();

/* ---------------- Teleduino çağrısı ---------------- */

/**
 * Pini sürer.
 * expireTime > 0 ise Teleduino pini belirtilen saniye sonra
 * ÖNCEKİ durumuna döndürür — tarayıcı kapansa bile kapı kapanır.
 */
async function setOutput(pin, output, expireTime = 0) {
    const url = `${CFG.BASE_URL}?k=${encodeURIComponent(CFG.API_KEY)}`
              + `&r=setDigitalOutput`
              + `&pin=${encodeURIComponent(pin)}`
              + `&output=${encodeURIComponent(output)}`
              + `&expire_time=${encodeURIComponent(expireTime)}`
              + `&save=0`;

    const ctrl  = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), CFG.REQUEST_TIMEOUT_MS);

    let data;
    try {
        const res = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        data = await res.json();
    } catch (err) {
        if (err.name === 'AbortError') throw new Error('Zaman aşımı (sunucu yanıt vermedi)');
        throw err;
    } finally {
        clearTimeout(timer);
    }

    if (Number(data?.status) === 200 && Number(data?.response?.result) === 1) {
        return true;
    }
    throw new Error(data?.message || 'API isteği başarısız');
}

/* ---------------- Kapı tetikleme ---------------- */

async function triggerDoor(doorKey) {
    if (busy) return;

    const door = DOORS[doorKey];
    if (!door) return;

    busy = true;
    setButtons(false);
    setStatus(`⏳ ${door.label} açılıyor...`, 'status-loading');
    vibrate(30);

    try {
        // AÇ: expire_time sayesinde donanım 'hold' saniye sonra kendisi kapatır
        await setOutput(door.pin, CFG.OPEN_OUTPUT, door.hold);

        setStatus(`🚪 ${door.label} açıldı — ${door.hold} sn sonra kapanacak`, 'status-success');
        vibrate([20, 60, 20]);

        // Bilgi amaçlı: kapanış bilgisini gecikmeli göster
        setTimeout(() => {
            setStatus(`🔒 ${door.label} kapatıldı`, 'status-closing');
            resetStatusLater(CFG.STATUS_RESET_MS);
        }, door.hold * 1000 + 300);

    } catch (err) {
        setStatus(`❌ ${door.label}: ${err.message}`, 'status-error');
        vibrate([80, 50, 80]);
        // Güvenlik: açma yarıda kaldıysa kapatmayı dene
        setOutput(door.pin, CFG.CLOSE_OUTPUT, 0).catch(() => {});
        resetStatusLater(CFG.STATUS_RESET_MS);

    } finally {
        setTimeout(() => {
            busy = false;
            setButtons(true);
        }, CFG.COOLDOWN_MS);
    }
}

btnWomen.addEventListener('click', () => triggerDoor('women'));
btnMen.addEventListener('click',   () => triggerDoor('men'));
</script>
</body>
</html>
